<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Área restrita | ITEP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <link rel="icon" href="/itep/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/itep/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/itep/apple-touch-icon.png">
    <meta name="theme-color" content="#0F3D22">
</head>
<body>
    <!-- Login -->
    <main class="login" id="login" hidden>
        <form class="login__card" id="loginForm" autocomplete="on">
            <div class="brand"><span class="brand__mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
            </span><span><strong>ITEP</strong><small>Área restrita</small></span></div>
            <h1>Entrar no painel</h1>
            <p>Gerencie o blog, as unidades e as mensagens recebidas pelo site.</p>
            <label for="pw">Senha</label>
            <input id="pw" type="password" autocomplete="current-password" required autofocus>
            <p class="msg msg--err" id="loginErr" role="alert" hidden></p>
            <button class="btn btn--primary" type="submit">Entrar</button>
            <a class="back" href="/itep/">← Voltar ao site</a>
        </form>
    </main>

    <!-- Painel -->
    <div class="app" id="app" hidden>
        <aside class="side" id="side">
            <div class="brand"><span class="brand__mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
            </span><span><strong>ITEP</strong><small>Área restrita</small></span></div>
            <nav aria-label="Seções do painel" id="nav"></nav>
            <div class="side__foot">
                <a href="/itep/" target="_blank" rel="noopener">Ver o site ↗</a>
                <button type="button" id="logout">Sair</button>
            </div>
        </aside>
        <div class="main">
            <header class="top">
                <button type="button" class="menu-btn" id="menuBtn" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button>
                <h1 id="title">Painel</h1>
            </header>
            <main class="content" id="view" tabindex="-1"></main>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="demo-api.js"></script>
    <script src="admin.js"></script>
</body>
</html>
